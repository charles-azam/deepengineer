[project]
name = "deepengineer"
version = "0.1.0"
description = "DeepEngineer is a deepsearch project focused on engineering"
readme = "README.md"
authors = [
    { name = "Charles Azam", email = "azamcharles0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "crawl4ai>=0.6.0",
    "smolagents>=1.19.0",
    "litellm",
    "pytest-asyncio>=1.0.0",
    "mistralai>=1.9.1",
    "linkup-sdk>=0.2.8",
    "tavily-python>=0.7.9",
    "pypdf>=5.7.0",
]

[project.scripts]
deepengineer = "deepengineer:main"

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.2.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py312']


[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
lint.ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

